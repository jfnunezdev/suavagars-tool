<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EAF6FF">
  <meta name="description" content="Meu Gestor de vagas da Sua Vaga RS.">
  <title>Meu Gestor - Sua Vaga RS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <nav class="app-nav" aria-label="Navegação principal">
      <a href="index.html">EDITOR DE POST</a>
      <a href="vagas.html" aria-current="page">MEU GESTOR</a>
    </nav>
    <header>
      <img src="logo.png" alt="Sua Vaga RS">
      <h1>🔥 Meu Gestor - @suavagars</h1>
      <p class="intro">Vagas atualizadas todos os dias</p>
      <a class="gestor-follow" href="index.html">⬅️ VOLTAR AO EDITOR DE POST</a>
      <a class="gestor-follow" href="https://instagram.com/suavagars" target="_blank" rel="noopener noreferrer">📱 Seguir @suavagars</a>
      <a class="gestor-follow" href="https://whatsapp.com/channel/0029VbEAoWKHwXb8eaOKcQ2p" target="_blank" rel="noopener noreferrer">💬 ENTRAR NO CANAL DO WHATSAPP</a>
    </header>

    <section aria-label="Vagas disponíveis">
      <p id="gestor-status" class="gestor-status" role="status" aria-live="polite">Carregando vagas...</p>
      <div id="vacancy-list" class="vacancy-list"></div>
    </section>

    <dialog id="delete-confirmation" class="delete-confirmation" aria-labelledby="delete-confirmation-message">
      <p id="delete-confirmation-message" class="delete-confirmation-message"></p>
      <p id="delete-confirmation-error" class="delete-confirmation-error" role="status" aria-live="polite"></p>
      <div class="delete-confirmation-actions">
        <button id="cancel-delete" class="secondary" type="button">Cancelar</button>
        <button id="confirm-delete" class="delete-confirm-button" type="button">Sí, Borrar</button>
      </div>
    </dialog>
  </main>

  <script>
    (function () {
      "use strict";

      var vacancyList = document.getElementById("vacancy-list");
      var status = document.getElementById("gestor-status");
      var deleteDialog = document.getElementById("delete-confirmation");
      var deleteMessage = document.getElementById("delete-confirmation-message");
      var deleteError = document.getElementById("delete-confirmation-error");
      var cancelDeleteButton = document.getElementById("cancel-delete");
      var confirmDeleteButton = document.getElementById("confirm-delete");
      var pendingDelete = null;
      var swipeRevealWidth = 112;

      function safeVacancyUrl(value) {
        try {
          var url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
        } catch (error) {
          return "";
        }
      }

      function addDetail(list, label, value) {
        var item = document.createElement("div");
        item.className = "vacancy-detail";
        var term = document.createElement("dt");
        term.textContent = label;
        var description = document.createElement("dd");
        description.textContent = value || "A consultar";
        item.appendChild(term);
        item.appendChild(description);
        list.appendChild(item);
      }

      function requestDelete(vacancy, swipeItem) {
        var role = vacancy.role || "esta vaga";
        var message = "¿Borrar la vaga de " + role + "? Esta acción no se puede deshacer";
        deleteMessage.textContent = message;
        deleteError.textContent = "";
        pendingDelete = { vacancy: vacancy, swipeItem: swipeItem };
        if (typeof deleteDialog.showModal === "function") {
          deleteDialog.showModal();
        } else if (window.confirm(message)) {
          deleteVacancy();
        } else {
          pendingDelete = null;
        }
      }

      async function deleteVacancy() {
        if (!pendingDelete) return;
        var deletion = pendingDelete;
        confirmDeleteButton.disabled = true;
        cancelDeleteButton.disabled = true;
        deleteError.textContent = "Excluindo vaga...";
        try {
          var response = await fetch("/api/vagas", {
            method: "DELETE",
            cache: "no-store",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ id: deletion.vacancy.id })
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result && result.error ? result.error : "Não foi possível apagar a vaga.");
          pendingDelete = null;
          if (typeof deleteDialog.close === "function" && deleteDialog.open) deleteDialog.close();
          deletion.swipeItem.classList.add("is-removing");
          status.textContent = "✅ Vaga apagada do Meu Gestor.";
          window.setTimeout(function () {
            if (deletion.swipeItem.parentNode) deletion.swipeItem.parentNode.removeChild(deletion.swipeItem);
          }, 260);
        } catch (error) {
          deleteError.textContent = error.message || "Não foi possível apagar a vaga.";
        } finally {
          confirmDeleteButton.disabled = false;
          cancelDeleteButton.disabled = false;
        }
      }

      function enableSwipe(swipeItem, card, vacancy, deleteButton) {
        var gesture = null;
        var suppressClick = false;
        deleteButton.addEventListener("click", function () {
          requestDelete(vacancy, swipeItem);
        });
        swipeItem.addEventListener("focusin", function (event) {
          if (event.target === deleteButton) swipeItem.classList.add("is-open");
        });

        swipeItem.addEventListener("pointerdown", function (event) {
          if (event.button !== 0 || event.target.closest("a, button, input, select, textarea")) return;
          gesture = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            initialX: swipeItem.classList.contains("is-open") ? -swipeRevealWidth : 0,
            horizontal: false,
            moved: false
          };
          swipeItem.classList.add("is-dragging");
          if (typeof swipeItem.setPointerCapture === "function") swipeItem.setPointerCapture(event.pointerId);
        });

        swipeItem.addEventListener("pointermove", function (event) {
          if (!gesture || event.pointerId !== gesture.pointerId) return;
          var deltaX = event.clientX - gesture.startX;
          var deltaY = event.clientY - gesture.startY;
          if (!gesture.horizontal && Math.abs(deltaY) > 8 && Math.abs(deltaY) > Math.abs(deltaX)) {
            swipeItem.classList.remove("is-dragging");
            gesture = null;
            return;
          }
          if (!gesture.horizontal && Math.abs(deltaX) > 8) gesture.horizontal = true;
          if (!gesture.horizontal) return;

          event.preventDefault();
          gesture.moved = true;
          var position = Math.max(-swipeRevealWidth, Math.min(0, gesture.initialX + deltaX));
          card.style.transform = "translateX(" + position + "px)";
        });

        swipeItem.addEventListener("pointerup", function (event) {
          if (!gesture || event.pointerId !== gesture.pointerId) return;
          var finalX = gesture.initialX + event.clientX - gesture.startX;
          var isOpen = gesture.horizontal ? finalX <= -(swipeRevealWidth / 2) : gesture.initialX < 0;
          if (gesture.moved) {
            suppressClick = true;
            window.setTimeout(function () { suppressClick = false; }, 0);
          }
          gesture = null;
          swipeItem.classList.remove("is-dragging");
          swipeItem.classList.toggle("is-open", isOpen);
          card.style.transform = "";
        });

        swipeItem.addEventListener("pointercancel", function () {
          gesture = null;
          swipeItem.classList.remove("is-dragging");
          card.style.transform = "";
        });

        swipeItem.addEventListener("click", function (event) {
          if (!suppressClick) return;
          event.preventDefault();
          event.stopPropagation();
          suppressClick = false;
        }, true);
      }

      function renderVacancies(vacancies) {
        while (vacancyList.firstChild) {
          vacancyList.removeChild(vacancyList.firstChild);
        }
        vacancies.forEach(function (vacancy) {
          var swipeItem = document.createElement("div");
          swipeItem.className = "vacancy-swipe";

          var deleteButton = document.createElement("button");
          deleteButton.className = "vacancy-delete";
          deleteButton.type = "button";
          deleteButton.textContent = "🗑️ BORRAR";
          deleteButton.setAttribute("aria-label", "Borrar vaga " + (vacancy.role || ""));

          var card = document.createElement("article");
          card.className = "card vacancy-card";

          var title = document.createElement("h2");
          title.textContent = vacancy.role || "Cargo a consultar";
          card.appendChild(title);

          var details = document.createElement("dl");
          details.className = "vacancy-details";
          addDetail(details, "Empresa", vacancy.company);
          addDetail(details, "📍 Cidade", vacancy.city);
          addDetail(details, "💰 Salário", vacancy.salary);
          addDetail(details, "📄 Tipo", vacancy.contractType);
          card.appendChild(details);

          var link = safeVacancyUrl(vacancy.link);
          if (link) {
            var apply = document.createElement("a");
            apply.className = "vacancy-apply";
            apply.href = link;
            apply.target = "_blank";
            apply.rel = "noopener noreferrer";
            apply.textContent = "👉 QUERO ESSA VAGA";
            card.appendChild(apply);
          }

          swipeItem.appendChild(deleteButton);
          swipeItem.appendChild(card);
          enableSwipe(swipeItem, card, vacancy, deleteButton);
          vacancyList.appendChild(swipeItem);
        });
      }

      cancelDeleteButton.addEventListener("click", function () {
        pendingDelete = null;
        if (typeof deleteDialog.close === "function" && deleteDialog.open) deleteDialog.close();
      });
      deleteDialog.addEventListener("cancel", function () {
        pendingDelete = null;
      });
      confirmDeleteButton.addEventListener("click", deleteVacancy);

      fetch("/api/vagas", { cache: "no-store", headers: { "Accept": "application/json" } })
        .then(function (response) {
          if (!response.ok) throw new Error("A API não está disponível.");
          return response.json();
        })
        .then(function (data) {
          if (!data || !Array.isArray(data.vagas)) throw new Error("A lista de vagas está inválida.");
          renderVacancies(data.vagas);
          status.textContent = data.vagas.length
            ? "Vagas publicadas pela Sua Vaga RS."
            : "Ainda não há vagas publicadas.";
        })
        .catch(function () {
          status.textContent = "A lista não pôde ser carregada. Tente atualizar a página em instantes.";
        });
    }());
  </script>
</body>
</html>
