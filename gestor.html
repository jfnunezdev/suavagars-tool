<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1c3d">
  <meta name="robots" content="noindex, nofollow">
  <title>GESTOR SUAVAGARS - Painel de Aprovação</title>
  <link rel="manifest" href="/gestor-manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .manager-page { width: min(100%, 900px); margin: 0 auto; }
    .manager-login { max-width: 440px; margin: 9vh auto 0; }
    .manager-brand {
      margin: -24px -16px 24px;
      padding: 26px 18px 24px;
      background: #0b1c3d;
      color: #fff;
      text-align: center;
      box-shadow: 0 6px 20px rgba(8, 24, 55, .2);
    }
    .manager-brand h1 { margin: 0; color: #fff; font-size: clamp(28px, 6vw, 42px); letter-spacing: 1px; line-height: 1.12; }
    .manager-brand p { margin: 7px 0 0; color: #d7e3f7; font-size: 16px; font-weight: 700; }
    .manager-brand img { width: 76px; height: 76px; object-fit: contain; }
    .manager-login h1 { margin: 0; color: var(--blue); }
    .manager-login .intro { margin: 8px 0 20px; }
    .manager-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 22px;
    }
    .manager-heading .secondary { width: auto; min-width: 120px; }
    .manager-section { margin: 24px 0; }
    .manager-section h2 { margin-bottom: 10px; }
    .manager-list { display: grid; gap: 14px; }
    .manager-card { margin: 0; }
    .manager-card h3 { margin: 0 0 12px; color: var(--blue); font-size: 1.2rem; }
    .manager-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
    .manager-details div { min-width: 0; padding: 10px; border-radius: 9px; background: #f3faff; }
    .manager-details dt { color: var(--muted); font-size: .82rem; font-weight: 700; }
    .manager-details dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    .manager-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .manager-card-actions .reject-button { background: #b3261e; }
    .manager-card-actions .reject-button:hover { background: #8d1d17; }
    .manager-status { min-height: 24px; margin: 8px 0; color: var(--muted); }
    .manager-count { display: inline-flex; min-width: 26px; height: 26px; align-items: center; justify-content: center; margin-left: 6px; border-radius: 999px; background: #f0ad24; color: #382300; font-size: .85rem; }
    @media (max-width: 520px) {
      .manager-heading { align-items: flex-start; flex-direction: column; }
      .manager-heading .secondary { width: 100%; }
      .manager-details { grid-template-columns: 1fr; }
      .manager-card-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="app-nav" aria-label="Navegação principal">
    <a href="ferramenta.html">EDITOR DE POST</a>
    <a href="gestor.html" aria-current="page">PAINEL DE APROVAÇÃO</a>
    <button id="logout-button" class="secondary" type="button" aria-busy="false" hidden><span class="spinner" id="logout-spinner" hidden></span>SAIR</button>
  </nav>

  <header class="manager-brand">
    <img src="logo.png" alt="" aria-hidden="true">
    <h1>GESTOR SUAVAGARS</h1>
    <p>Painel de Aprovação de Vagas</p>
  </header>

  <main class="manager-page">
    <p id="auth-status" class="manager-status" role="status" aria-live="polite">Verificando acesso...</p>
    <section id="login-panel" class="card manager-login" aria-labelledby="login-title" hidden>
      <h1 id="login-title">Entrar no painel</h1>
      <p class="intro">Área privada do GESTOR SUAVAGARS.</p>
      <form id="login-form">
        <div class="field">
          <label for="manager-password">Senha do painel</label>
          <div class="password-field">
            <input id="manager-password" type="password" autocomplete="current-password" required>
            <button id="manager-password-toggle" class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
              <svg id="manager-password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="manager-password-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"></path><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"></path><path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
            </button>
          </div>
        </div>
        <button id="login-button" type="submit" aria-busy="false"><span class="spinner" id="login-spinner" hidden></span>ENTRAR</button>
      </form>
      <p id="login-status" class="manager-status" role="status" aria-live="polite"></p>
    </section>

    <section id="manager-panel" hidden>
      <header class="manager-heading">
        <div>
          <p class="intro">Revise as solicitações antes de publicar.</p>
        </div>
      </header>

      <section class="manager-section" aria-labelledby="pending-title">
        <h2 id="pending-title">Solicitações Pendentes <span id="pending-count" class="manager-count">0</span></h2>
        <p id="pending-status" class="manager-status" role="status" aria-live="polite"></p>
        <div id="pending-list" class="manager-list"></div>
      </section>

      <section class="manager-section" aria-labelledby="published-title">
        <h2 id="published-title">Vagas Publicadas</h2>
        <p id="published-status" class="manager-status" role="status" aria-live="polite"></p>
        <div id="published-list" class="manager-list"></div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var authStatus = document.getElementById("auth-status");
      var loginPanel = document.getElementById("login-panel");
      var managerPanel = document.getElementById("manager-panel");
      var loginForm = document.getElementById("login-form");
      var loginStatus = document.getElementById("login-status");
      var loginButton = document.getElementById("login-button");
      var logoutButton = document.getElementById("logout-button");
      var managerPassword = document.getElementById("manager-password");
      var passwordToggle = document.getElementById("manager-password-toggle");
      var pendingList = document.getElementById("pending-list");
      var pendingStatus = document.getElementById("pending-status");
      var pendingCount = document.getElementById("pending-count");
      var publishedList = document.getElementById("published-list");
      var publishedStatus = document.getElementById("published-status");
      var refreshTimer = null;
      var isLoadingManagerData = false;
      var reloadAfterCurrentLoad = false;
      var trackedPendingIds = null;
      var notificationAudioContext = null;
      var notificationSoundQueued = false;
      var titleBlinkTimer = null;
      var reminderTimer = null;
      var pendingAlertActive = false;
      var originalPageTitle = document.title;

      function resetPasswordToggle() {
        managerPassword.type = "password";
        passwordToggle.setAttribute("aria-label", "Mostrar senha");
        passwordToggle.setAttribute("aria-pressed", "false");
        document.getElementById("manager-password-eye").hidden = false;
        document.getElementById("manager-password-eye-off").hidden = true;
      }

      function showLogin(message) {
        if (refreshTimer) {
          window.clearInterval(refreshTimer);
          refreshTimer = null;
        }
        stopPendingReminder();
        trackedPendingIds = null;
        pendingStatus.textContent = "";
        publishedStatus.textContent = "";
        clearListLoading(pendingList);
        clearListLoading(publishedList);
        pendingList.replaceChildren();
        publishedList.replaceChildren();
        authStatus.hidden = true;
        loginPanel.hidden = false;
        managerPanel.hidden = true;
        logoutButton.hidden = true;
        resetPasswordToggle();
        if (message) loginStatus.textContent = message;
        document.getElementById("manager-password").focus();
      }

      function showManager() {
        authStatus.hidden = true;
        loginPanel.hidden = true;
        managerPanel.hidden = false;
        logoutButton.hidden = false;
        resetPasswordToggle();
        loadManagerData();
        if (!refreshTimer) {
          refreshTimer = window.setInterval(function () {
            loadManagerData(true);
          }, 15000);
        }
      }

      function replayQueuedNotification(event) {
        if (!notificationSoundQueued || !pendingAlertActive) return;
        var target = event && event.target;
        if (target && typeof target.closest === "function" && target.closest(".manager-card-actions")) return;
        notificationSoundQueued = false;
        playNotificationSound();
      }

      function unlockNotificationAudio(event) {
        var AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextConstructor) return;
        try {
          if (!notificationAudioContext) notificationAudioContext = new AudioContextConstructor();
          if (notificationAudioContext.state !== "running") {
            notificationAudioContext.resume()
              .then(function () { replayQueuedNotification(event); })
              .catch(function (error) {
                console.warn("Não foi possível habilitar o som de novas solicitações.", error);
              });
          } else {
            replayQueuedNotification(event);
          }
        } catch (error) {
          console.warn("Não foi possível habilitar o som de novas solicitações.", error);
        }
      }

      function scheduleChimeTone(frequency, startTime, duration) {
        var oscillator = notificationAudioContext.createOscillator();
        var volume = notificationAudioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, startTime);
        volume.gain.setValueAtTime(0.0001, startTime);
        volume.gain.exponentialRampToValueAtTime(0.62, startTime + 0.04);
        volume.gain.setValueAtTime(0.62, startTime + duration - 0.1);
        volume.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        oscillator.connect(volume);
        volume.connect(notificationAudioContext.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.02);
      }

      function playNotificationSound() {
        if (!notificationAudioContext) {
          notificationSoundQueued = true;
          console.warn("Interaja com o painel uma vez para habilitar o som de notificações.");
          return;
        }
        var playChime = function () {
          for (var repetition = 0; repetition < 3; repetition += 1) {
            var startTime = notificationAudioContext.currentTime + 0.08 + repetition * 1.5;
            scheduleChimeTone(784, startTime, 0.42);
            scheduleChimeTone(659.25, startTime + 0.48, 0.46);
          }
        };
        if (notificationAudioContext.state !== "running") {
          notificationAudioContext.resume().then(playChime).catch(function (error) {
            notificationSoundQueued = true;
            console.warn("Não foi possível tocar o som de novas solicitações.", error);
          });
          return;
        }
        playChime();
      }

      function startTitleBlink() {
        if (titleBlinkTimer) return;
        var showAlertTitle = true;
        document.title = "(1) NOVA VAGA!";
        titleBlinkTimer = window.setInterval(function () {
          document.title = showAlertTitle ? "(1) NOVA VAGA!" : originalPageTitle;
          showAlertTitle = !showAlertTitle;
        }, 600);
      }

      function stopTitleBlink() {
        if (titleBlinkTimer) {
          window.clearInterval(titleBlinkTimer);
          titleBlinkTimer = null;
        }
        document.title = originalPageTitle;
      }

      function startPendingReminder(notifyImmediately) {
        pendingAlertActive = true;
        if (notifyImmediately) {
          startTitleBlink();
          playNotificationSound();
        }
        if (!reminderTimer) {
          reminderTimer = window.setInterval(function () {
            if (!pendingAlertActive) return;
            startTitleBlink();
            playNotificationSound();
          }, 300000);
        }
      }

      function stopPendingReminder() {
        pendingAlertActive = false;
        notificationSoundQueued = false;
        if (reminderTimer) {
          window.clearInterval(reminderTimer);
          reminderTimer = null;
        }
        stopTitleBlink();
      }

      document.addEventListener("pointerdown", unlockNotificationAudio);
      document.addEventListener("keydown", unlockNotificationAudio);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) stopTitleBlink();
      });
      window.addEventListener("focus", stopTitleBlink);

      function addDetail(list, label, value) {
        var row = document.createElement("div");
        var term = document.createElement("dt");
        term.textContent = label;
        var description = document.createElement("dd");
        description.textContent = value || "A consultar";
        row.appendChild(term);
        row.appendChild(description);
        list.appendChild(row);
      }

      function createEmptyState(message) {
        var wrapper = document.createElement("div");
        wrapper.className = "empty-state";
        var paragraph = document.createElement("p");
        paragraph.textContent = message;
        wrapper.appendChild(paragraph);
        return wrapper;
      }

      function clearListLoading(list) {
        list.removeAttribute("aria-busy");
      }

      function showListLoading(list, count) {
        list.replaceChildren();
        for (var index = 0; index < count; index += 1) {
          var card = document.createElement("div");
          card.className = "skeleton-card";
          card.setAttribute("aria-hidden", "true");
          ["skeleton skeleton-line long", "skeleton skeleton-line short", "skeleton skeleton-line short"].forEach(function (lineClass) {
            var line = document.createElement("div");
            line.className = lineClass;
            card.appendChild(line);
          });
          list.appendChild(card);
        }
        list.setAttribute("aria-busy", "true");
      }

      function addActionButton(container, label, className, handler) {
        var button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-busy", "false");
        var spinner = document.createElement("span");
        spinner.className = "spinner";
        spinner.hidden = true;
        button.appendChild(spinner);
        button.appendChild(document.createTextNode(" " + label));
        if (className) button.className = className;
        button.addEventListener("click", handler);
        container.appendChild(button);
        return button;
      }

      function renderPending(applications) {
        clearListLoading(pendingList);
        pendingList.replaceChildren();
        pendingCount.textContent = String(applications.length);
        if (!applications.length) {
          pendingStatus.textContent = "Não há vagas aguardando revisão.";
          pendingList.appendChild(createEmptyState("Nenhuma solicitação pendente no momento."));
          return;
        }
        pendingStatus.textContent = "Revise os dados e autorize apenas as vagas que devem aparecer no site.";
        applications.forEach(function (application) {
          var card = document.createElement("article");
          card.className = "card manager-card";
          var title = document.createElement("h3");
          title.textContent = application.role || "Cargo a consultar";
          card.appendChild(title);

          var details = document.createElement("dl");
          details.className = "manager-details";
          [
            ["Empresa", application.company],
            ["Cidade", application.city],
            ["Salário", application.salary],
            ["Modelo", application.model],
            ["Tipo", application.contractType],
            ["Horário", application.schedule],
            ["Contato", application.contactName],
            ["WhatsApp", application.contactPhone],
            ["E-mail", application.contactEmail],
            ["Link de candidatura", application.link],
            ["Atividades", application.activities],
            ["Benefícios", application.benefits],
            ["Requisitos", application.requirements]
          ].forEach(function (detail) {
            if (detail[1]) addDetail(details, detail[0], detail[1]);
          });
          card.appendChild(details);

          var actions = document.createElement("div");
          actions.className = "manager-card-actions";
          addActionButton(actions, "AUTORIZAR / PUBLICAR VAGA", "", function (event) {
            processApplication(application.id, "approve", event.currentTarget);
          });
          addActionButton(actions, "RECUSAR SOLICITAÇÃO", "reject-button", function (event) {
            if (window.confirm("Recusar e remover a solicitação de " + (application.role || "vaga") + "?")) {
              processApplication(application.id, "reject", event.currentTarget);
            }
          });
          card.appendChild(actions);
          pendingList.appendChild(card);
        });
      }

      function renderPublished(vacancies) {
        clearListLoading(publishedList);
        publishedList.replaceChildren();
        if (!vacancies.length) {
          publishedStatus.textContent = "Não há vagas publicadas.";
          publishedList.appendChild(createEmptyState("Nenhuma vaga publicada no momento."));
          return;
        }
        publishedStatus.textContent = "Estas vagas aparecem na página pública.";
        vacancies.forEach(function (vacancy) {
          var card = document.createElement("article");
          card.className = "card manager-card";
          var title = document.createElement("h3");
          title.textContent = vacancy.role || "Cargo a consultar";
          card.appendChild(title);
          var details = document.createElement("dl");
          details.className = "manager-details";
          [
            ["Empresa", vacancy.company],
            ["Cidade", vacancy.city],
            ["Salário", vacancy.salary],
            ["Tipo", vacancy.contractType]
          ].forEach(function (detail) {
            addDetail(details, detail[0], detail[1]);
          });
          card.appendChild(details);
          addActionButton(card, "EXCLUIR VAGA PUBLICADA", "reject-button", function (event) {
            if (window.confirm("Excluir a vaga de " + (vacancy.role || "cargo") + " do site?")) {
              deleteVacancy(vacancy.id, event.currentTarget);
            }
          });
          publishedList.appendChild(card);
        });
      }

      async function loadManagerData(silent) {
        if (isLoadingManagerData) {
          if (!silent) reloadAfterCurrentLoad = true;
          return;
        }
        isLoadingManagerData = true;
        var showLoadingState = !silent;
        if (showLoadingState) {
          pendingStatus.textContent = "Carregando solicitações...";
          publishedStatus.textContent = "Carregando vagas...";
          showListLoading(pendingList, 2);
          showListLoading(publishedList, 2);
        }
        try {
          var responses = await Promise.all([
            fetch("/api/candidaturas", { cache: "no-store", headers: { "Accept": "application/json" } }),
            fetch("/api/vagas", { cache: "no-store", headers: { "Accept": "application/json" } })
          ]);
          if (responses.some(function (response) { return response.status === 401; })) {
            showLogin("Sua sessão expirou. Entre novamente.");
            return;
          }
          var results = await Promise.all(responses.map(function (response) {
            return response.json().then(function (data) {
              if (!response.ok) throw new Error(data && data.error ? data.error : "Não foi possível carregar o painel.");
              return data;
            });
          }));
          if (!Array.isArray(results[0].solicitacoes) || !Array.isArray(results[1].vagas)) {
            throw new Error("Os dados recebidos do painel estão inválidos.");
          }
          var applications = results[0].solicitacoes;
          var currentPendingIds = new Set(applications.map(function (application) { return application.id; }));
          var isFirstPendingLoad = trackedPendingIds === null;
          var pendingListChanged = trackedPendingIds === null ||
            currentPendingIds.size !== trackedPendingIds.size ||
            Array.from(currentPendingIds).some(function (id) { return !trackedPendingIds.has(id); });
          var hasNewApplications = !isFirstPendingLoad &&
            Array.from(currentPendingIds).some(function (id) { return !trackedPendingIds.has(id); });
          trackedPendingIds = currentPendingIds;
          if (pendingListChanged || showLoadingState) renderPending(applications);
          renderPublished(results[1].vagas);
          if (!applications.length) {
            stopPendingReminder();
          } else {
            startPendingReminder(isFirstPendingLoad || hasNewApplications);
          }
        } catch (error) {
          var pendingMessage = error.message || "Não foi possível carregar as solicitações.";
          pendingStatus.textContent = pendingMessage;
          publishedStatus.textContent = "Atualize a página para tentar novamente.";
          clearListLoading(pendingList);
          clearListLoading(publishedList);
          pendingList.replaceChildren(createEmptyState(pendingMessage));
          publishedList.replaceChildren(createEmptyState("Atualize a página para tentar novamente."));
        } finally {
          isLoadingManagerData = false;
          if (reloadAfterCurrentLoad) {
            reloadAfterCurrentLoad = false;
            loadManagerData(true);
          }
        }
      }

      async function processApplication(id, action, button) {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        var spinner = button.querySelector(".spinner");
        if (spinner) spinner.hidden = false;
        pendingStatus.textContent = action === "approve" ? "Publicando vaga..." : "Recusando solicitação...";
        try {
          var response = await fetch("/api/candidaturas", {
            method: action === "approve" ? "PATCH" : "DELETE",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ id: id })
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result && result.error ? result.error : "Não foi possível processar a solicitação.");
          await loadManagerData();
        } catch (error) {
          pendingStatus.textContent = error.message || "Não foi possível processar a solicitação.";
          button.disabled = false;
          button.setAttribute("aria-busy", "false");
          var spinner = button.querySelector(".spinner");
          if (spinner) spinner.hidden = true;
        }
      }

      async function deleteVacancy(id, button) {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        var spinner = button.querySelector(".spinner");
        if (spinner) spinner.hidden = false;
        publishedStatus.textContent = "Excluindo vaga...";
        try {
          var response = await fetch("/api/vagas", {
            method: "DELETE",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ id: id })
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result && result.error ? result.error : "Não foi possível excluir a vaga.");
          await loadManagerData();
        } catch (error) {
          publishedStatus.textContent = error.message || "Não foi possível excluir a vaga.";
          button.disabled = false;
          button.setAttribute("aria-busy", "false");
          var spinner = button.querySelector(".spinner");
          if (spinner) spinner.hidden = true;
        }
      }

      passwordToggle.addEventListener("click", function () {
        var visible = managerPassword.type === "password";
        managerPassword.type = visible ? "text" : "password";
        passwordToggle.setAttribute("aria-label", visible ? "Ocultar senha" : "Mostrar senha");
        passwordToggle.setAttribute("aria-pressed", visible ? "true" : "false");
        document.getElementById("manager-password-eye").hidden = visible;
        document.getElementById("manager-password-eye-off").hidden = !visible;
        managerPassword.focus();
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        loginButton.disabled = true;
        loginButton.setAttribute("aria-busy", "true");
        document.getElementById("login-spinner").hidden = false;
        loginStatus.textContent = "Validando acesso...";
        try {
          var response = await fetch("/api/gestor-auth", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ password: document.getElementById("manager-password").value })
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result && result.error ? result.error : "Não foi possível entrar.");
          loginForm.reset();
          loginStatus.textContent = "";
          showManager();
        } catch (error) {
          loginStatus.textContent = error.message || "Não foi possível entrar.";
        } finally {
          loginButton.disabled = false;
          loginButton.setAttribute("aria-busy", "false");
          document.getElementById("login-spinner").hidden = true;
        }
      });

      logoutButton.addEventListener("click", async function () {
        logoutButton.disabled = true;
        logoutButton.setAttribute("aria-busy", "true");
        document.getElementById("logout-spinner").hidden = false;
        await fetch("/api/gestor-auth", { method: "DELETE", cache: "no-store" });
        logoutButton.disabled = false;
        logoutButton.setAttribute("aria-busy", "false");
        document.getElementById("logout-spinner").hidden = true;
        showLogin("Você saiu do painel.");
      });

      fetch("/api/gestor-auth", { cache: "no-store", headers: { "Accept": "application/json" } })
        .then(function (response) {
          if (!response.ok) throw new Error("Não foi possível verificar o acesso.");
          return response.json();
        })
        .then(function (data) {
          if (data.authenticated) showManager();
          else showLogin();
        })
        .catch(function (error) {
          showLogin(error.message);
        });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (error) {

        });
      }
    }());
